name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK firmado
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Nioro-Print.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nioro-Print
          path: Nioro-Print.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Nioro-Print.apk \
            --title "Nioro Print v${{ github.run_number }}" \
            --notes "APK firmado de Nioro Print (build ${{ github.run_number }})." \
            --latest
